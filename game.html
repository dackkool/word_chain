<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣東話數白欖近音/同音接龍</title>
<!-- 載入粵語拼音庫 -->
<script src="https://cdn.jsdelivr.net/npm/to-jyutping@1.3.0/to-jyutping.js"></script>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
  background: #fff8e1;
  margin: 0;
  padding: 15px;
  display: flex;
  justify-content: center;
}
.card {
  background: #ffffff;
  border: 3px solid #ffb300;
  border-radius: 15px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
h1 {
  color: #e65100;
  font-size: 1.3rem;
  margin: 0;
}
.btn-start {
  background: #ff9800;
  color: #ffffff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
}
.score {
  font-size: 1.2rem;
  color: #d84315;
  font-weight: bold;
  margin-bottom: 10px;
  text-align: left;
}
.box {
  background: #f1f8e9;
  border: 2px dashed #81c784;
  border-radius: 10px;
  padding: 10px;
  height: 220px;
  overflow-y: auto;
  text-align: left;
  margin-bottom: 10px;
  font-size: 1.1rem;
  line-height: 1.6;
}
.bar-bg {
  background: #e0e0e0;
  height: 10px;
  border-radius: 5px;
  margin-bottom: 15px;
}
.bar {
  background: #ff5722;
  height: 100%;
  width: 0%;
}
.inputs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
input {
  flex: 1;
  padding: 12px;
  border: 2px solid #ffb300;
  border-radius: 8px;
  font-size: 1.1rem;
  text-align: center;
}
.btn-send {
  background: #ff9800;
  color: #ffffff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}
.btn-voice {
  width: 100%;
  background: #2e7d32 !important;
  color: #ffffff !important;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.btn-voice.recording {
  background: #c62828 !important;
}
button:disabled {
  background: #ccc !important;
  color: #888 !important;
  cursor: not-allowed;
  box-shadow: none !important;
}
.status {
  margin-top: 12px;
  font-weight: bold;
  color: #1565c0;
  min-height: 24px;
}
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <h1>🥁 廣東話近音數白欖接龍</h1>
    <button id="startBtn" class="btn-start" onclick="startGame()" disabled>載入詞庫中...</button>
  </div>

  <div class="score">得分：<span id="score">0</span> 分</div>

  <div id="box" class="box">正在載入廣東話高品質詞庫...</div>

  <div class="bar-bg"><div id="bar" class="bar"></div></div>

  <div class="inputs">
    <input type="text" id="wordInput" placeholder="輸入詞語（支援同音/近音字）" disabled onkeypress="handleKeyPress(event)">
    <button id="sendBtn" class="btn-send" onclick="submitWord()" disabled>送出</button>
  </div>

  <button id="voiceBtn" class="btn-voice" onclick="toggleVoice()" disabled>🎤 按此廣東話語音輸入</button>

  <div id="status" class="status">正在下載線上記錄詞庫...</div>
</div>

<script>
let baseWords = [];
let words = [];
let chain = [];
let usedWords = new Set();
let score = 0;
let isPlayerTurn = false;
let timer = null;
let recognition = null;
let isListening = false;

window.addEventListener('DOMContentLoaded', () => {
  loadDictionary();
});

// 載入優質詞庫（優先從線上載入，失敗則讀取本地 word.txt）
function loadDictionary() {
  fetch('https://raw.githubusercontent.com/samsonko/hongkong-cantonese-dict/master/dict.txt')
    .then(res => res.text())
    .catch(() => fetch('word.txt').then(res => res.text()))
    .then(text => {
      let rawList = text.split(/[\r\n,，\s]+/);
      let set = new Set();
      
      for (let w of rawList) {
        let trimmed = w.trim().replace(/[^\u4e00-\u9fa5]/g, '');
        // 只保留 2 至 4 個字的大眾常用真實詞彙
        if (trimmed.length >= 2 && trimmed.length <= 4) {
          set.add(trimmed);
        }
      }

      baseWords = Array.from(set);

      if (baseWords.length === 0) {
        document.getElementById('status').innerText = "⚠️ 詞庫載入失敗！";
        return;
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').innerText = '開始遊戲';
      document.getElementById('status').innerText = `近音接龍模式就緒！（共 ${baseWords.length} 詞）`;
      document.getElementById('box').innerText = "點擊「開始遊戲」啟動對戰！";
    })
    .catch(err => {
      console.error(err);
      document.getElementById('status').innerText = "❌ 載入失敗！請檢查網絡。";
    });
}

// 🎯 廣東話「同音」與「大約近音」的核心判定機制
function getJyutpingList(char) {
  if (window.ToJyutping) {
    try {
      let jp = ToJyutping.get(char);
      if (jp && jp.length > 0) return jp;
    } catch(e){}
  }
  return [char];
}

// 將拼音拆解成 [音素(去掉數字調號), 聲調]
function parseJyutping(jpStr) {
  if (!jpStr) return { base: "", tone: "" };
  let match = jpStr.match(/^([a-z]+)([1-6]?)$/i);
  if (match) {
    let base = match[1].toLowerCase();
    // 處理懶音模糊化：將 l 換成 n，z/s/c 模糊化
    base = base.replace(/^l/, 'n'); 
    return { base: base, tone: match[2] };
  }
  return { base: jpStr.toLowerCase(), tone: "" };
}

function isHomophoneOrNearSound(char1, char2) {
  if (char1 === char2) return true; // 1. 完全同字

  let list1 = getJyutpingList(char1);
  let list2 = getJyutpingList(char2);

  for (let p1 of list1) {
    let parsed1 = parseJyutping(p1);
    for (let p2 of list2) {
      let parsed2 = parseJyutping(p2);

      // 2. 完全同音 (包含聲調)
      if (p1 === p2) return true;

      // 3. 大約近音 (聲母+韻母相同，無視 1~6 聲調差異，例如：界 gaai3 vs 街 gaai1)
      if (parsed1.base === parsed2.base) return true;
    }
  }
  return false;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'zh-HK';
  recognition.continuous = false;
  
  recognition.onstart = function() {
    isListening = true;
    let btn = document.getElementById('voiceBtn');
    btn.classList.add('recording');
    btn.innerText = '🛑 正在聆聽廣東話...';
  };

  recognition.onresult = function(e) {
    let text = e.results[0][0].transcript.replace(/[。，！？\s]/g, '');
    document.getElementById('wordInput').value = text;
    submitWord();
  };

  recognition.onerror = function() { stopVoiceUI(); };
  recognition.onend = function() { stopVoiceUI(); };
}

function stopVoiceUI() {
  isListening = false;
  let btn = document.getElementById('voiceBtn');
  btn.classList.remove('recording');
  btn.innerText = '🎤 按此廣東話語音輸入';
}

function toggleVoice() {
  if (!SR) {
    alert("您的瀏覽器不支援語音辨識，請使用 Chrome 開啟。");
    return;
  }
  if (!isPlayerTurn) return;

  if (isListening) {
    try { recognition.stop(); } catch(e){}
  } else {
    try { recognition.start(); } catch(e){}
  }
}

function formatTail(w) { return w + '個' + w.slice(-1); }

function readChain(callback) {
  window.speechSynthesis.cancel();
  let text = chain.map(formatTail).join("，");
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'zh-HK';
  msg.onend = function() { if(callback) callback(); };
  msg.onerror = function() { if(callback) callback(); };
  window.speechSynthesis.speak(msg);
}

function updateDisplay() {
  let html = "";
  for (let i = 0; i < chain.length; i++) {
    let role = (i % 2 === 0) ? "[電腦]" : "[玩家]";
    html += "<div>" + role + " " + formatTail(chain[i]) + "</div>";
  }
  let box = document.getElementById('box');
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function startGame() {
  if (baseWords.length === 0) return;

  score = 0;
  chain = [];
  usedWords.clear();
  words = [...baseWords];
  
  document.getElementById('score').innerText = score;
  document.getElementById('startBtn').innerText = '重新開始';

  let first = words[Math.floor(Math.random() * words.length)];
  chain.push(first);
  usedWords.add(first);

  updateDisplay();
  document.getElementById('status').innerText = "AI 由頭朗讀中...";
  readChain(function() { nextTurn(); });
}

function nextTurn() {
  isPlayerTurn = true;
  let lastChar = chain[chain.length - 1].slice(-1);
  
  document.getElementById('status').innerText = `輪到你！請接「${lastChar}」字或近音字（5秒）`;
  
  let input = document.getElementById('wordInput');
  input.disabled = false;
  input.value = "";
  input.focus();
  
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('voiceBtn').disabled = false;

  startTimer(5, function() { 
    gameOver("時間到！未能於 5 秒內接龍。"); 
  });
}

function handleKeyPress(e) {
  if (e.key === 'Enter') submitWord();
}

function submitWord() {
  if (!isPlayerTurn) return;
  
  let val = document.getElementById('wordInput').value.trim();
  let lastChar = chain[chain.length - 1].slice(-1);

  if (!val || val.length < 2) {
    gameOver("詞語太短！必須為最少 2 個字的詞語。");
    return;
  }

  let userFirstChar = val.charAt(0);

  // 🎯 近音 / 同音判定
  if (!isHomophoneOrNearSound(userFirstChar, lastChar)) {
    gameOver(`接錯字！「${val}」的首字「${userFirstChar}」與「${lastChar}」不同音也不近音。`);
    return;
  }

  if (usedWords.has(val)) {
    gameOver("詞語重複！「" + val + "」之前已經講過啦。");
    return;
  }

  stopTimer();
  disableInputs();
  isPlayerTurn = false;

  score++;
  document.getElementById('score').innerText = score;
  chain.push(val);
  usedWords.add(val);
  
  updateDisplay();

  document.getElementById('status').innerText = "答對！AI 朗讀中...";
  readChain(function() { aiTurn(); });
}

function aiTurn() {
  let lastChar = chain[chain.length - 1].slice(-1);
  
  // 🎯 電腦會優先找近音/同音的實用詞彙
  let next = words.find(w => !usedWords.has(w) && isHomophoneOrNearSound(w.charAt(0), lastChar));
  
  if (!next) {
    gameOver("電腦詞窮認輸啦！找不到可以接「" + lastChar + "」（或同音/近音字）的詞語，恭喜你獲勝！");
    return;
  }

  chain.push(next);
  usedWords.add(next);
  
  updateDisplay();
  document.getElementById('status').innerText = "電腦接：「" + next + "」，AI 朗讀中...";
  readChain(function() { nextTurn(); });
}

function startTimer(sec, onTimeout) {
  stopTimer();
  let bar = document.getElementById('bar');
  bar.style.width = '100%';
  let start = Date.now();
  
  timer = setInterval(function() {
    let passed = (Date.now() - start) / 1000;
    let left = Math.max(0, 100 - (passed / sec * 100));
    bar.style.width = left + '%';
    if (passed >= sec) { stopTimer(); onTimeout(); }
  }, 100);
}

function stopTimer() {
  if (timer) clearInterval(timer);
  document.getElementById('bar').style.width = '0%';
}

function disableInputs() {
  document.getElementById('wordInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('voiceBtn').disabled = true;
}

function gameOver(reason) {
  stopTimer();
  disableInputs();
  isPlayerTurn = false;
  
  document.getElementById('status').innerText = "💥 遊戲結束！" + reason;
  
  let msg = new SpeechSynthesisUtterance("遊戲結束！" + reason);
  msg.lang = 'zh-HK';
  window.speechSynthesis.speak(msg);
}
</script>

</body>
</html>
