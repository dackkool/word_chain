<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣東話數白欖同音/近音接龍</title>
<!-- 載入粵語拼音庫 -->
<script src="https://cdn.jsdelivr.net/npm/to-jyutping@1.3.0/to-jyutping.js"></script>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
  background: #fff8e1;
  margin: 0;
  padding: 15px;
  display: flex;
  justify-content: center;
}
.card {
  background: #ffffff;
  border: 3px solid #ffb300;
  border-radius: 15px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
h1 {
  color: #e65100;
  font-size: 1.3rem;
  margin: 0;
}
.btn-start {
  background: #ff9800;
  color: #ffffff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
}
.score {
  font-size: 1.2rem;
  color: #d84315;
  font-weight: bold;
  margin-bottom: 10px;
  text-align: left;
}
.box {
  background: #f1f8e9;
  border: 2px dashed #81c784;
  border-radius: 10px;
  padding: 10px;
  height: 220px;
  overflow-y: auto;
  text-align: left;
  margin-bottom: 10px;
  font-size: 1.1rem;
  line-height: 1.6;
}
.bar-bg {
  background: #e0e0e0;
  height: 10px;
  border-radius: 5px;
  margin-bottom: 15px;
}
.bar {
  background: #ff5722;
  height: 100%;
  width: 0%;
}
.inputs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
input {
  flex: 1;
  padding: 12px;
  border: 2px solid #ffb300;
  border-radius: 8px;
  font-size: 1.1rem;
  text-align: center;
}
.btn-send {
  background: #ff9800;
  color: #ffffff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}
.btn-voice {
  width: 100%;
  background: #2e7d32 !important;
  color: #ffffff !important;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.btn-voice.recording {
  background: #c62828 !important;
}
button:disabled {
  background: #ccc !important;
  color: #888 !important;
  cursor: not-allowed;
  box-shadow: none !important;
}
.status {
  margin-top: 12px;
  font-weight: bold;
  color: #1565c0;
  min-height: 24px;
}
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <h1>🥁 廣東話近音數白欖接龍</h1>
    <button id="startBtn" class="btn-start" onclick="startGame()" disabled>載入詞庫中...</button>
  </div>

  <div class="score">得分：<span id="score">0</span> 分</div>

  <div id="box" class="box">正在載入廣東話詞庫...</div>

  <div class="bar-bg"><div id="bar" class="bar"></div></div>

  <div class="inputs">
    <input type="text" id="wordInput" placeholder="輸入詞語（支援同音/近音字）" disabled onkeypress="handleKeyPress(event)">
    <button id="sendBtn" class="btn-send" onclick="submitWord()" disabled>送出</button>
  </div>

  <button id="voiceBtn" class="btn-voice" onclick="toggleVoice()" disabled>🎤 按此廣東話語音輸入</button>

  <div id="status" class="status">正在初始化詞庫...</div>
</div>

<script>
let baseWords = [];
let words = [];
let chain = [];
let usedWords = new Set();
let score = 0;
let isPlayerTurn = false;
let timer = null;
let recognition = null;
let isListening = false;

// 內建廣東話備用詞庫（防止瀏覽器封鎖本地 file:// 讀取 word.txt）
const fallbackWords = [
  "香港", "九龍", "新界", "中環", "灣仔", "銅鑼灣", "尖沙咀", "旺角", "深水埗", "觀塘",
  "荃灣", "沙田", "屯門", "元朗", "大埔", "上水", "赤柱", "西貢", "長洲", "大澳",
  "莊園", "裝置", "裝飾", "莊重", "裝修", "莊家", "服裝", "化妝",
  "奶茶", "凍奶茶", "檸檬茶", "凍檸茶", "鴛鴦", "蛋撻", "菠蘿包", "燒鵝", "叉燒", "燒肉",
  "蝦餃", "燒賣", "粉果", "腸粉", "蘿蔔糕", "車仔麵", "雲吞麵", "牛腩麵", "乾炒牛河", "魚蛋",
  "雞蛋", "雞蛋仔", "格仔餅", "碗仔翅", "臭豆腐", "豆腐花", "茶餐廳", "酒樓", "冰室", "點心",
  "打工", "返工", "放工", "放假", "人工", "老闆", "同事", "收工", "加班", "睇戲",
  "聽歌", "唱歌", "跳舞", "行街", "購物", "買衫", "食飯", "飲茶", "傾偈", "吹水",
  "廣東話", "粵語", "白話", "聲調", "數白欖", "接龍", "遊戲", "開心", "快樂", "巴士",
  "小巴", "地鐵", "電車", "的士", "渡輪", "飛機", "單車", "馬路", "車站", "手機",
  "世界", "界限", "街市", "解釋", "歷史", "時間", "空間", "社會", "經濟", "文化"
];

// 常見廣東話同音字與常用近音字字典補強
const customHomophoneMap = {
  '莊': ['zong'], '裝': ['zong'], '葬': ['zong'], '藏': ['zong', 'cong'],
  '界': ['gaai'], '街': ['gaai'], '解': ['gaai'], '介': ['gaai'], '雞': ['gai'],
  '世': ['sai'], '細': ['sai'], '西': ['sai'], '茜': ['sai'],
  '下': ['haa'], '夏': ['haa'], '蝦': ['haa'],
  '形': ['jing'], '型': ['jing'], '迎': ['jing'], '贏': ['jing'],
  '長': ['coeng', 'zoeng'], '場': ['coeng'],
  '勿': ['mat'], '物': ['mat'], '佛': ['fat'], '密': ['mat'], '蜜': ['mat'],
  '紙': ['zi'], '子': ['zi'], '紫': ['zi'], '姊': ['zi'], '旨': ['zi'], '止': ['zi']
};

window.addEventListener('DOMContentLoaded', () => {
  loadDictionary();
});

function loadDictionary() {
  fetch('word.txt')
    .then(res => {
      if (!res.ok) throw new Error("無法讀取 word.txt");
      return res.text();
    })
    .then(text => {
      let rawList = text.split(/[\r\n,，\s]+/);
      parseAndSetWords(rawList, "已成功載入 word.txt 詞庫");
    })
    .catch(err => {
      console.warn("無法讀取 word.txt（可能因瀏覽器安全限制），自動啟用內建備用廣東話詞庫。");
      parseAndSetWords(fallbackWords, "已載入內建廣東話詞庫");
    });
}

function parseAndSetWords(rawList, sourceMsg) {
  let set = new Set();
  for (let w of rawList) {
    let trimmed = w.trim().replace(/[^\u4e00-\u9fa5]/g, '');
    if (trimmed.length >= 2 && trimmed.length <= 4) {
      set.add(trimmed);
    }
  }

  baseWords = Array.from(set);

  if (baseWords.length === 0) {
    document.getElementById('status').innerText = "⚠️ 無有效詞語！";
    return;
  }

  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').innerText = '開始遊戲';
  document.getElementById('status').innerText = `${sourceMsg}（共 ${baseWords.length} 詞）`;
  document.getElementById('box').innerText = "點擊「開始遊戲」啟動對戰！";
}

// 🎯 廣東話同音與近音判定演算法
function getJyutpingList(char) {
  if (window.ToJyutping) {
    try {
      let jp = ToJyutping.get(char);
      if (jp && jp.length > 0) return jp;
    } catch(e){}
  }
  return [char];
}

function parseJyutping(jpStr) {
  if (!jpStr) return { base: "", tone: "" };
  // 提取拼音（去除聲調數字 1-6）
  let match = jpStr.match(/^([a-z]+)([1-6]?)$/i);
  if (match) {
    let base = match[1].toLowerCase()
      // 廣東話常見懶音與近音相通處理：
      .replace(/^l/, 'n')   // n / l 不分
      .replace(/^ng/, '')   // 疑母 / 零聲母 不分
      .replace(/^c/, 'z')   // z / c 近音寬鬆
      .replace(/^k/, 'g');  // g / k 近音寬鬆
    return { base: base, tone: match[2] };
  }
  return { base: jpStr.toLowerCase(), tone: "" };
}

function isHomophoneOrNearSound(char1, char2) {
  // 1. 完全相同的字
  if (char1 === char2) return true;

  // 2. 檢查手動補強詞庫
  let custom1 = customHomophoneMap[char1];
  let custom2 = customHomophoneMap[char2];
  if (custom1 && custom2) {
    if (custom1.some(p => custom2.includes(p))) return true;
  }

  // 3. 使用 ToJyutping 拼音庫進行同音/近音拆解
  let list1 = getJyutpingList(char1);
  let list2 = getJyutpingList(char2);

  for (let p1 of list1) {
    let parsed1 = parseJyutping(p1);
    for (let p2 of list2) {
      let parsed2 = parseJyutping(p2);
      
      // 完全同音 或 無視聲調後拼音相同（如 zi2 與 zi2、zi2 與 zi3）
      if (p1 === p2 || parsed1.base === parsed2.base) {
        return true;
      }
    }
  }

  return false;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'zh-HK';
  recognition.continuous = false;
  
  recognition.onstart = function() {
    isListening = true;
    let btn = document.getElementById('voiceBtn');
    btn.classList.add('recording');
    btn.innerText = '🛑 正在聆聽廣東話...';
  };

  recognition.onresult = function(e) {
    let text = e.results[0][0].transcript.replace(/[。，！？\s]/g, '');
    document.getElementById('wordInput').value = text;
    submitWord();
  };

  recognition.onerror = function() { stopVoiceUI(); };
  recognition.onend = function() { stopVoiceUI(); };
}

function stopVoiceUI() {
  isListening = false;
  let btn = document.getElementById('voiceBtn');
  btn.classList.remove('recording');
  btn.innerText = '🎤 按此廣東話語音輸入';
}

function toggleVoice() {
  if (!SR) {
    alert("您的瀏覽器不支援語音辨識，請使用 Chrome 開啟。");
    return;
  }
  if (!isPlayerTurn) return;

  if (isListening) {
    try { recognition.stop(); } catch(e){}
  } else {
    try { recognition.start(); } catch(e){}
  }
}

function formatTail(w) { return w + '個' + w.slice(-1); }

function readChain(callback) {
  window.speechSynthesis.cancel();
  let text = chain.map(formatTail).join("，");
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'zh-HK';
  msg.onend = function() { if(callback) callback(); };
  msg.onerror = function() { if(callback) callback(); };
  window.speechSynthesis.speak(msg);
}

function updateDisplay() {
  let html = "";
  for (let i = 0; i < chain.length; i++) {
    let role = (i % 2 === 0) ? "[電腦]" : "[玩家]";
    html += "<div>" + role + " " + formatTail(chain[i]) + "</div>";
  }
  let box = document.getElementById('box');
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function startGame() {
  if (baseWords.length === 0) return;

  score = 0;
  chain = [];
  usedWords.clear();
  words = [...baseWords];
  
  document.getElementById('score').innerText = score;
  document.getElementById('startBtn').innerText = '重新開始';

  let first = words[Math.floor(Math.random() * words.length)];
  chain.push(first);
  usedWords.add(first);

  updateDisplay();
  document.getElementById('status').innerText = "AI 由頭朗讀中...";
  readChain(function() { nextTurn(); });
}

function nextTurn() {
  isPlayerTurn = true;
  let lastChar = chain[chain.length - 1].slice(-1);
  
  document.getElementById('status').innerText = `輪到你！請接「${lastChar}」字或近音字（10秒）`;
  
  let input = document.getElementById('wordInput');
  input.disabled = false;
  input.value = "";
  input.focus();
  
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('voiceBtn').disabled = false;

  startTimer(10, function() { 
    gameOver("時間到！未能於 10 秒內接龍。"); 
  });
}

function handleKeyPress(e) {
  if (e.key === 'Enter') submitWord();
}

function submitWord() {
  if (!isPlayerTurn) return;
  
  let val = document.getElementById('wordInput').value.trim();
  let lastChar = chain[chain.length - 1].slice(-1);

  if (!val || val.length < 2) {
    gameOver("詞語太短！必須為最少 2 個字的詞語。");
    return;
  }

  let userFirstChar = val.charAt(0);

  if (!isHomophoneOrNearSound(userFirstChar, lastChar)) {
    gameOver(`接錯字！「${val}」的首字「${userFirstChar}」與「${lastChar}」不同音也不近音。`);
    return;
  }

  if (usedWords.has(val)) {
    gameOver("詞語重複！「" + val + "」之前已經講過啦。");
    return;
  }

  stopTimer();
  disableInputs();
  isPlayerTurn = false;

  score++;
  document.getElementById('score').innerText = score;
  chain.push(val);
  usedWords.add(val);
  
  updateDisplay();

  document.getElementById('status').innerText = "答對！AI 朗讀中...";
  readChain(function() { aiTurn(); });
}

function aiTurn() {
  let lastChar = chain[chain.length - 1].slice(-1);
  
  let next = words.find(w => !usedWords.has(w) && isHomophoneOrNearSound(w.charAt(0), lastChar));
  
  if (!next) {
    gameOver("電腦詞窮認輸啦！找不到可以接「" + lastChar + "」（或同音/近音字）的詞語，恭喜你獲勝！");
    return;
  }

  chain.push(next);
  usedWords.add(next);
  
  updateDisplay();
  document.getElementById('status').innerText = "電腦接：「" + next + "」，AI 朗讀中...";
  readChain(function() { nextTurn(); });
}

function startTimer(sec, onTimeout) {
  stopTimer();
  let bar = document.getElementById('bar');
  bar.style.width = '100%';
  let start = Date.now();
  
  timer = setInterval(function() {
    let passed = (Date.now() - start) / 1000;
    let left = Math.max(0, 100 - (passed / sec * 100));
    bar.style.width = left + '%';
    if (passed >= sec) { stopTimer(); onTimeout(); }
  }, 100);
}

function stopTimer() {
  if (timer) clearInterval(timer);
  document.getElementById('bar').style.width = '0%';
}

function disableInputs() {
  document.getElementById('wordInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('voiceBtn').disabled = true;
}

function gameOver(reason) {
  stopTimer();
  disableInputs();
  isPlayerTurn = false;
  
  document.getElementById('status').innerText = "💥 遊戲結束！" + reason;
  
  let msg = new SpeechSynthesisUtterance("遊戲結束！" + reason);
  msg.lang = 'zh-HK';
  window.speechSynthesis.speak(msg);
}
</script>

</body>
</html>
