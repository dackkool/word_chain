<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣東話數白欖接龍</title>
<style>
body{font-family:sans-serif;background:#fff8e1;margin:0;padding:15px;display:flex;justify-content:center}
.card{background:#fff;border:3px solid #ffb300;border-radius:15px;padding:20px;width:100%;max-width:400px;text-align:center}
h1{color:#e65100;font-size:1.5rem;margin:0 0 10px}
.score{font-size:1.2rem;color:#d84315;font-weight:700;margin-bottom:10px}
.box{background:#f1f8e9;border:2px dashed #81c784;border-radius:10px;padding:10px;height:150px;overflow-y:auto;text-align:left;margin-bottom:10px;font-size:1.1rem;line-height:1.6}
.bar-bg{background:#e0e0e0;height:10px;border-radius:5px;margin-bottom:15px}
.bar{background:#ff5722;height:100%;width:0%}
.inputs{display:flex;gap:5px;margin-bottom:15px}
input{flex:1;padding:10px;border:2px solid #ffb300;border-radius:8px;font-size:1rem;text-align:center}
.btn-send{background:#ff9800;color:#fff;border:none;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-voice{background:#2e7d32!important;color:#fff!important;border:none;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-start{width:100%;background:#e65100;color:#fff;border:none;padding:12px;border-radius:8px;font-size:1.1rem;font-weight:700;cursor:pointer}
button:disabled{background:#ccc!important;color:#888!important;cursor:not-allowed}
.status{margin-top:10px;font-weight:700;color:#1565c0}
</style>
</head>
<body>

<div class="card">
  <h1>🥁 廣東話數白欖接龍</h1>
  <div class="score">得分：<span id="score">0</span></div>

  <div id="box" class="box">點擊「開始遊戲」！</div>

  <div class="bar-bg"><div id="bar" class="bar"></div></div>

  <div class="inputs">
    <input type="text" id="wordInput" placeholder="請輸入詞語" disabled>
    <button id="sendBtn" class="btn-send" onclick="submitWord()" disabled>送出</button>
    <button id="voiceBtn" class="btn-voice" onclick="toggleVoice()" disabled>🎤 語音</button>
  </div>

  <button id="startBtn" class="btn-start" onclick="startGame()">開始遊戲</button>
  <div id="status" class="status">準備就緒</div>
</div>

<script>
const words = ["口水", "水花", "花朵", "太陽", "陽光", "光明", "明月", "月亮", "蘋果", "果汁", "天空", "空氣", "氣球", "香港", "港口"];
let chain = [];
let score = 0;
let isPlayerTurn = false;
let timer = null;
let recognition = null;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'zh-HK';
  recognition.onresult = function(e) {
    let text = e.results[0][0].transcript.replace(/[。，！？\s]/g, '');
    document.getElementById('wordInput').value = text;
    submitWord();
  };
}

function formatTail(w) { return w + '個' + w.slice(-1); }

function readChain(callback) {
  window.speechSynthesis.cancel();
  let text = chain.map(formatTail).join("，");
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'zh-HK';
  msg.onend = function() { if(callback) callback(); };
  msg.onerror = function() { if(callback) callback(); };
  window.speechSynthesis.speak(msg);
}

function updateDisplay() {
  let html = "";
  for (let i = 0; i < chain.length; i++) {
    let role = (i % 2 === 0) ? "[電腦]" : "[玩家]";
    html += "<div>" + role + " " + formatTail(chain[i]) + "</div>";
  }
  let box = document.getElementById('box');
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function startGame() {
  score = 0;
  chain = [];
  document.getElementById('score').innerText = score;
  document.getElementById('startBtn').disabled = true;

  let first = words[Math.floor(Math.random() * words.length)];
  chain.push(first);

  updateDisplay();
  document.getElementById('status').innerText = "AI 由頭朗讀中...";
  readChain(function() { nextTurn(); });
}

function nextTurn() {
  isPlayerTurn = true;
  let lastChar = chain[chain.length - 1].slice(-1);
  document.getElementById('status').innerText = "輪到你！請接「" + lastChar + "」字（5秒）";
  
  let input = document.getElementById('wordInput');
  input.disabled = false;
  input.value = "";
  input.focus();
  
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('voiceBtn').disabled = false;

  startTimer(5, function() { gameOver("時間到！"); });
}

function submitWord() {
  if (!isPlayerTurn) return;
  let val = document.getElementById('wordInput').value.trim();
  let lastChar = chain[chain.length - 1].slice(-1);

  if (!val || val.charAt(0) !== lastChar) {
    document.getElementById('status').innerText = "接錯了！要由「" + lastChar + "」開頭";
    return;
  }

  stopTimer();
  disableInputs();
  isPlayerTurn = false;

  score++;
  document.getElementById('score').innerText = score;
  chain.push(val);
  updateDisplay();

  document.getElementById('status').innerText = "答對！AI 由頭朗讀中...";
  readChain(function() { aiTurn(); });
}

function aiTurn() {
  let lastChar = chain[chain.length - 1].slice(-1);
  let next = words.find(w => w.startsWith(lastChar)) || (lastChar + "子");
  
  chain.push(next);
  updateDisplay();
  document.getElementById('status').innerText = "電腦接：「" + next + "」，AI 朗讀中...";
  readChain(function() { nextTurn(); });
}

function toggleVoice() {
  if (recognition && isPlayerTurn) {
    try { recognition.start(); } catch(e){}
  }
}

function startTimer(sec, onTimeout) {
  stopTimer();
  let bar = document.getElementById('bar');
  bar.style.width = '100%';
  let start = Date.now();
  
  timer = setInterval(function() {
    let passed = (Date.now() - start) / 1000;
    let left = Math.max(0, 100 - (passed / sec * 100));
    bar.style.width = left + '%';
    if (passed >= sec) { stopTimer(); onTimeout(); }
  }, 100);
}

function stopTimer() {
  if (timer) clearInterval(timer);
  document.getElementById('bar').style.width = '0%';
}

function disableInputs() {
  document.getElementById('wordInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('voiceBtn').disabled = true;
}

function gameOver(msg) {
  stopTimer();
  disableInputs();
  isPlayerTurn = false;
  document.getElementById('status').innerText = "💥 遊戲結束！" + msg;
  document.getElementById('startBtn').disabled = false;
}
</script>

</body>
</html>
