<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣東話數白欖接龍</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
  background: #fff8e1;
  margin: 0;
  padding: 15px;
  display: flex;
  justify-content: center;
}
.card {
  background: #ffffff;
  border: 3px solid #ffb300;
  border-radius: 15px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
h1 {
  color: #e65100;
  font-size: 1.3rem;
  margin: 0;
}
.btn-start {
  background: #ff9800;
  color: #ffffff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
}
.score {
  font-size: 1.2rem;
  color: #d84315;
  font-weight: bold;
  margin-bottom: 10px;
  text-align: left;
}
.box {
  background: #f1f8e9;
  border: 2px dashed #81c784;
  border-radius: 10px;
  padding: 10px;
  height: 160px;
  overflow-y: auto;
  text-align: left;
  margin-bottom: 10px;
  font-size: 1.1rem;
  line-height: 1.6;
}
.bar-bg {
  background: #e0e0e0;
  height: 10px;
  border-radius: 5px;
  margin-bottom: 15px;
}
.bar {
  background: #ff5722;
  height: 100%;
  width: 0%;
}
.inputs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
input {
  flex: 1;
  padding: 12px;
  border: 2px solid #ffb300;
  border-radius: 8px;
  font-size: 1.1rem;
  text-align: center;
}
.btn-send {
  background: #ff9800;
  color: #ffffff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}
.btn-voice {
  width: 100%;
  background: #2e7d32 !important;
  color: #ffffff !important;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.btn-voice.recording {
  background: #c62828 !important;
}
button:disabled {
  background: #ccc !important;
  color: #888 !important;
  cursor: not-allowed;
  box-shadow: none !important;
}
.status {
  margin-top: 12px;
  font-weight: bold;
  color: #1565c0;
  min-height: 24px;
}
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <h1>🥁 廣東話數白欖接龍</h1>
    <button id="startBtn" class="btn-start" onclick="startGame()">開始遊戲</button>
  </div>

  <div class="score">得分：<span id="score">0</span> 分</div>

  <div id="box" class="box">點擊「開始遊戲」啟動對戰！</div>

  <div class="bar-bg"><div id="bar" class="bar"></div></div>

  <div class="inputs">
    <input type="text" id="wordInput" placeholder="請輸入詞語" disabled onkeypress="handleKeyPress(event)">
    <button id="sendBtn" class="btn-send" onclick="submitWord()" disabled>送出</button>
  </div>

  <button id="voiceBtn" class="btn-voice" onclick="toggleVoice()" disabled>🎤 按此廣東話語音輸入</button>

  <div id="status" class="status">準備就緒</div>
</div>

<script>
// 擴充廣東話日常生活常用詞庫
const baseWords = [
  // 地點與地理
  "香港", "港口", "廣東", "廣州", "九龍", "旺角", "中環", "天星", "碼頭",
  "機場", "車站", "站立", "公園", "園林", "林木", "市場", "場地", "地方",
  // 飲食與美食
  "奶茶", "茶餐廳", "蛋撻", "撻沙", "燒鵝", "鵝肉", "牛肉", "肉包",
  "包子", "點心", "心意", "意思", "蘋果", "果汁", "汁液", "雪糕",
  "糕點", "西餅", "餅乾", "乾麵", "麵條", "豆腐", "腐竹", "竹筍",
  // 交通與生活用品
  "巴士", "士多", "電車", "車票", "票價", "價格", "格子", "子彈",
  "電話", "話筒", "冷氣", "氣球", "球場", "衣服", "服裝", "鞋子",
  // 天氣與自然
  "太陽", "陽光", "光明", "明月", "月亮", "天空", "空氣", "水花",
  "花朵", "朵朵", "口水", "水晶", "晶晶", "樹木", "木頭", "頭髮",
  // 學習與日常
  "小學", "學生", "生活", "活潑", "方向", "發展", "展覽", "立刻"
];

let words = [...baseWords];
let chain = [];
let usedWords = new Set();
let score = 0;
let isPlayerTurn = false;
let timer = null;
let recognition = null;
let isListening = false;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'zh-HK';
  recognition.continuous = false;
  
  recognition.onstart = function() {
    isListening = true;
    let btn = document.getElementById('voiceBtn');
    btn.classList.add('recording');
    btn.innerText = '🛑 正在聆聽廣東話...';
  };

  recognition.onresult = function(e) {
    let text = e.results[0][0].transcript.replace(/[。，！？\s]/g, '');
    document.getElementById('wordInput').value = text;
    submitWord();
  };

  recognition.onerror = function() { stopVoiceUI(); };
  recognition.onend = function() { stopVoiceUI(); };
}

function stopVoiceUI() {
  isListening = false;
  let btn = document.getElementById('voiceBtn');
  btn.classList.remove('recording');
  btn.innerText = '🎤 按此廣東話語音輸入';
}

function toggleVoice() {
  if (!SR) {
    alert("您的瀏覽器不支援語音辨識，請使用 Chrome 開啟。");
    return;
  }
  if (!isPlayerTurn) return;

  if (isListening) {
    try { recognition.stop(); } catch(e){}
  } else {
    try { recognition.start(); } catch(e){}
  }
}

function formatTail(w) { return w + '個' + w.slice(-1); }

function readChain(callback) {
  window.speechSynthesis.cancel();
  let text = chain.map(formatTail).join("，");
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'zh-HK';
  msg.onend = function() { if(callback) callback(); };
  msg.onerror = function() { if(callback) callback(); };
  window.speechSynthesis.speak(msg);
}

function updateDisplay() {
  let html = "";
  for (let i = 0; i < chain.length; i++) {
    let role = (i % 2 === 0) ? "[電腦]" : "[玩家]";
    html += "<div>" + role + " " + formatTail(chain[i]) + "</div>";
  }
  let box = document.getElementById('box');
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function startGame() {
  score = 0;
  chain = [];
  usedWords.clear();
  words = [...baseWords];
  
  document.getElementById('score').innerText = score;
  document.getElementById('startBtn').innerText = '重新開始';

  let first = words[Math.floor(Math.random() * words.length)];
  chain.push(first);
  usedWords.add(first);

  updateDisplay();
  document.getElementById('status').innerText = "AI 由頭朗讀中...";
  readChain(function() { nextTurn(); });
}

function nextTurn() {
  isPlayerTurn = true;
  let lastChar = chain[chain.length - 1].slice(-1);
  document.getElementById('status').innerText = "輪到你！請接「" + lastChar + "」字（5秒）";
  
  let input = document.getElementById('wordInput');
  input.disabled = false;
  input.value = "";
  input.focus();
  
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('voiceBtn').disabled = false;

  startTimer(5, function() { 
    gameOver("時間到！未能於 5 秒內接龍。"); 
  });
}

function handleKeyPress(e) {
  if (e.key === 'Enter') submitWord();
}

function submitWord() {
  if (!isPlayerTurn) return;
  
  let val = document.getElementById('wordInput').value.trim();
  let lastChar = chain[chain.length - 1].slice(-1);

  if (!val || val.length < 2) {
    gameOver("詞語太短！必須為最少 2 個字的詞語。");
    return;
  }

  if (val.charAt(0) !== lastChar) {
    gameOver("接錯字！「" + val + "」並非由「" + lastChar + "」字開頭。");
    return;
  }

  if (usedWords.has(val)) {
    gameOver("詞語重複！「" + val + "」之前已經講過啦。");
    return;
  }

  stopTimer();
  disableInputs();
  isPlayerTurn = false;

  score++;
  document.getElementById('score').innerText = score;
  chain.push(val);
  usedWords.add(val);
  
  updateDisplay();

  document.getElementById('status').innerText = "答對！AI 朗讀中...";
  readChain(function() { aiTurn(); });
}

function aiTurn() {
  let lastChar = chain[chain.length - 1].slice(-1);
  let next = words.find(w => w.startsWith(lastChar) && !usedWords.has(w)) || (lastChar + "子");
  
  chain.push(next);
  usedWords.add(next);
  
  updateDisplay();
  document.getElementById('status').innerText = "電腦接：「" + next + "」，AI 朗讀中...";
  readChain(function() { nextTurn(); });
}

function startTimer(sec, onTimeout) {
  stopTimer();
  let bar = document.getElementById('bar');
  bar.style.width = '100%';
  let start = Date.now();
  
  timer = setInterval(function() {
    let passed = (Date.now() - start) / 1000;
    let left = Math.max(0, 100 - (passed / sec * 100));
    bar.style.width = left + '%';
    if (passed >= sec) { stopTimer(); onTimeout(); }
  }, 100);
}

function stopTimer() {
  if (timer) clearInterval(timer);
  document.getElementById('bar').style.width = '0%';
}

function disableInputs() {
  document.getElementById('wordInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('voiceBtn').disabled = true;
}

function gameOver(reason) {
  stopTimer();
  disableInputs();
  isPlayerTurn = false;
  
  document.getElementById('status').innerText = "💥 遊戲結束！" + reason;
  
  let msg = new SpeechSynthesisUtterance("遊戲結束！" + reason);
  msg.lang = 'zh-HK';
  window.speechSynthesis.speak(msg);
}
</script>

</body>
</html>
